# test env manifest to setup dependencies under <west topdir>/dependencies
# for zmk v0.3-branch
# should be initialized with west init -l west --mf west-test-isolated-v0.3.yml
manifest:
  self:
    path: west
    import:
      file: west-dependency-v0.3 # import west-dependency.yml and west-test-dependency.yml for v0.3
      path-prefix: dependencies
  # Please edit west/west-dependency/ to change dependencies
